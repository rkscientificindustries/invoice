spring:
  application:
    name: invoice
  datasource:
    url: jdbc:postgresql://localhost:5433/invoice_db
    username: user
    password: secret

logging:
  level:
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,flyway
  endpoint:
    health:
      show-details: always

vaadin:
  launch-browser: false

invoice:
  customers: 10
  products: 10
  invoices: 5
  pdf:
    company:
      name: ${COMPANY_NAME:Company Name}
      gstin: ${COMPANY_GSTIN:00XXXXXXX0X0X0}
      address: ${COMPANY_ADDRESS:Your Address}
      phone: ${COMPANY_PHONE:+91-XXXXXXXXXX}
      email: ${COMPANY_EMAIL:contact@example.com}
      logo-path: static/logo-rk-sm.jpg
    bank:
      bank-name: ${BANK_NAME:Your Bank}
      account-number: ${BANK_ACCOUNT:XXXXXXXXXXXX}
      ifsc: ${BANK_IFSC:XXXXXXXXX}
